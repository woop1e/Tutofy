services:

  # ── Backend: все Go-сервисы в одном контейнере ─────────────────────────────
  - type: web
    name: tutofy-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: starter          # 512MB RAM, $7/month — free tier не хватит для 16 сервисов
    healthCheckPath: /auth/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tutofy-db
          property: connectionString

      - key: REDIS_URL
        value: ""          # Вставь URL от Upstash (бесплатно: upstash.com)

      - key: JWT_SECRET
        generateValue: true   # Render сам сгенерирует

      - key: MINIO_USER
        value: minioadmin
      - key: MINIO_PASS
        value: minioadmin123

      - key: APP_URL
        value: ""          # Заполнится после первого деплоя (твой .onrender.com URL)

      - key: S3_PUBLIC_ENDPOINT
        value: ""          # Тот же .onrender.com URL + :9000 (или внешний MinIO)

      # SMTP — оставь пустым если не нужны email-уведомления
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: SMTP_FROM
        value: ""

      # Google OAuth — оставь пустым если не используешь
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
      - key: GOOGLE_REDIRECT_URI
        value: ""

  # ── Frontend: React SPA → static site (бесплатно навсегда) ───────────────
  - type: web
    name: tutofy-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./tutofy/frontend/dist
    rootDir: tutofy/frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: ""           # пустой = запросы идут через относительный путь (нужен proxy)

# ── База данных ─────────────────────────────────────────────────────────────
databases:
  - name: tutofy-db
    plan: free              # Бесплатно 90 дней, потом $7/month
    databaseName: tutofy
    user: tutofy
