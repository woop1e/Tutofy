syntax = "proto3";

package submission;

option go_package = "submission-service/proto/submissionpb";

message SubmitAssignmentRequest {
  string assignment_id = 1;
  string content       = 2;
  string file_id       = 3;
}

message GetSubmissionRequest {
  string assignment_id = 1;
  string student_id    = 2;
}

message GetAssignmentSubmissionsRequest {
  string assignment_id = 1;
  int32  limit         = 2;
  int32  offset        = 3;
}

message MarkGradedRequest {
  string assignment_id = 1;
  string student_id    = 2;
}

message SubmissionResponse {
  string id            = 1;
  string assignment_id = 2;
  string student_id    = 3;
  string content       = 4;
  string file_id       = 5;
  string status        = 6;
  string submitted_at  = 7;
}

message SubmissionsList {
  repeated SubmissionResponse submissions = 1;
}

service SubmissionService {
  rpc SubmitAssignment(SubmitAssignmentRequest)               returns (SubmissionResponse);
  rpc GetSubmission(GetSubmissionRequest)                     returns (SubmissionResponse);
  rpc GetAssignmentSubmissions(GetAssignmentSubmissionsRequest) returns (SubmissionsList);
  rpc MarkGraded(MarkGradedRequest)                          returns (SubmissionResponse);
}
