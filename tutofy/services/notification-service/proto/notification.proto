syntax = "proto3";

package notification;

option go_package = "notification-service/proto/notificationpb";

import "google/protobuf/timestamp.proto";

enum NotificationType {
  NOTIFICATION_TYPE_UNSPECIFIED   = 0;
  NOTIFICATION_TYPE_GRADE         = 1;
  NOTIFICATION_TYPE_ENROLLMENT    = 2;
  NOTIFICATION_TYPE_NEW_LESSON    = 3;
  NOTIFICATION_TYPE_NEW_MESSAGE   = 4;
  NOTIFICATION_TYPE_ASSIGNMENT    = 5;
  NOTIFICATION_TYPE_COURSE_DONE   = 6;
}

message Notification {
  string                    id         = 1;
  string                    user_id    = 2;
  NotificationType          type       = 3;
  string                    message    = 4;
  bool                      is_read    = 5;
  google.protobuf.Timestamp created_at = 6;
}

// Called by grading-service when a grade is submitted.
message NotifyGradeRequest {
  string assignment_id = 1;
  string student_id    = 2;
  float  grade         = 3;
}

message NotifyGradeResponse {}

// Called by student to fetch their unread/all notifications.
message GetNotificationsRequest {
  string user_id      = 1;
  bool   unread_only  = 2;
}

message NotificationsList {
  repeated Notification notifications = 1;
}

// Called by student to mark a notification as read.
message MarkReadRequest {
  string notification_id = 1;
}

message MarkReadResponse {}

// Generic internal RPC — any service can notify any user.
message NotifyUserRequest {
  string user_id  = 1;
  int32  type     = 2;  // NotificationType int value
  string message  = 3;
}

service NotificationService {
  rpc NotifyGrade        (NotifyGradeRequest)       returns (NotifyGradeResponse);
  rpc NotifyUser         (NotifyUserRequest)         returns (NotifyGradeResponse);
  rpc GetNotifications   (GetNotificationsRequest)  returns (NotificationsList);
  rpc MarkAsRead         (MarkReadRequest)           returns (MarkReadResponse);
}
