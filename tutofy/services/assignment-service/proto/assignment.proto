syntax = "proto3";

package assignment;

option go_package = "assignment-service/proto/assignmentpb";

message CreateAssignmentRequest {
  string title       = 1;
  string description = 2;
  string course_id   = 3;
  string due_date    = 4;
}

message CourseRequest {
  string course_id = 1;
  int32  limit     = 2;
  int32  offset    = 3;
}

message GetAssignmentRequest {
  string assignment_id = 1;
}

message DeleteAssignmentRequest {
  string assignment_id = 1;
}

message UpdateAssignmentRequest {
  string assignment_id = 1;
  string title         = 2;
  string description   = 3;
  string due_date      = 4;
}

message AssignmentResponse {
  string id          = 1;
  string title       = 2;
  string description = 3;
  string course_id   = 4;
  string due_date    = 5;
}

message AssignmentsList {
  repeated AssignmentResponse assignments = 1;
}

message Empty {}

service AssignmentService {
  rpc CreateAssignment(CreateAssignmentRequest)     returns (AssignmentResponse);
  rpc GetAssignment(GetAssignmentRequest)           returns (AssignmentResponse);
  rpc GetAssignmentsByCourse(CourseRequest)         returns (AssignmentsList);
  rpc UpdateAssignment(UpdateAssignmentRequest)     returns (AssignmentResponse);
  rpc DeleteAssignment(DeleteAssignmentRequest)     returns (Empty);
}
