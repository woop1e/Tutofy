version: "3.9"


services:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tutofy
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutofy"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/tutofy-media &&
        echo 'Bucket ready'
      "

  # ── Services ──────────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
      network: host
    environment:
      DB_URL: "postgres://tutofy:secret@postgres/auth?sslmode=disable"
      PORT: "50051"
      JWT_SECRET: "change-me-in-production"
      REDIS_ADDR: "redis:6379"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      APP_URL: "${APP_URL:-http://localhost:5173}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
      network: host
    environment:
      DB_URL: "postgres://tutofy:secret@postgres/users?sslmode=disable"
      PORT: "50052"
      AUTH_SERVICE_ADDR: "auth-service:50051"
      REDIS_ADDR: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  course-service:
    build:
      context: .
      dockerfile: course-service/Dockerfile
      network: host
    environment:
      DB_URL: "postgres://tutofy:secret@postgres/courses?sslmode=disable"
      PORT: "50053"
      AUTH_SERVICE_ADDR: "auth-service:50051"
      REDIS_ADDR: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  enrollment-service:
    build:
      context: .
      dockerfile: enrollment-service/Dockerfile
      network: host
    environment:
      DB_URL: "postgres://tutofy:secret@postgres/enrollments?sslmode=disable"
      PORT: "50054"
      AUTH_SERVICE_ADDR: "auth-service:50051"
      COURSE_SERVICE_ADDR: "course-service:50053"
      NOTIFICATION_SERVICE_ADDR: "notification-service:50057"
      PAYMENT_SERVICE_ADDR: "payment-service:50061"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      course-service:
        condition: service_started
      notification-service:
        condition: service_started
      payment-service:
        condition: service_started
    restart: unless-stopped

  lesson-service:
    build:
      context: .
      dockerfile: lesson-service/Dockerfile
      network: host
    environment:
      DB_URL: "postgres://tutofy:secret@postgres/lessons?sslmode=disable"
      PORT: "50055"
      AUTH_SERVICE_ADDR: "auth-service:50051"
      COURSE_SERVICE_ADDR: "course-service:50053"
      ENROLLMENT_SERVICE_ADDR: "enrollment-service:50054"
      PROGRESS_SERVICE_ADDR: "progress-service:50058"
      NATS_ADDR: "nats://nats:4222"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      auth-service:
        condition: service_started
      course-service:
        condition: service_started
      enrollment-service:
        condition: service_started
    restart: unless-stopped

  grading-service:
    build:
      context: .
      dockerfile: grading-service/Dockerfile
      network: host
    environment:
      DB_URL: "postgres://tutofy:secret@postgres/grading?sslmode=disable"
      PORT: "50056"
      AUTH_SERVICE_ADDR: "auth-service:50051"
      ASSIGNMENT_SERVICE_ADDR: "assignment-service:50059"
      ENROLLMENT_SERVICE_ADDR: "enrollment-service:50054"
      NOTIFICATION_SERVICE_ADDR: "notification-service:50057"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      assignment-service:
        condition: service_started
      enrollment-service:
        condition: service_started
      notification-service:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
      network: host
    environment:
      DB_URL: "postgres://tutofy:secret@postgres/notifications?sslmode=disable"
      PORT: "50057"
      AUTH_SERVICE_ADDR: "auth-service:50051"
      USER_SERVICE_ADDR: "user-service:50052"
      NATS_ADDR: "nats://nats:4222"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
    restart: unless-stopped

  progress-service:
    build:
      context: .
      dockerfile: progress-service/Dockerfile
      network: host
    environment:
      DB_URL: "postgres://tutofy:secret@postgres/progress?sslmode=disable"
      PORT: "50058"
      AUTH_SERVICE_ADDR: "auth-service:50051"
      NATS_ADDR: "nats://nats:4222"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      auth-service:
        condition: service_started
    restart: unless-stopped

  assignment-service:
    build:
      context: .
      dockerfile: assignment-service/Dockerfile
      network: host
    environment:
      DB_URL: "postgres://tutofy:secret@postgres/assignments?sslmode=disable"
      PORT: "50059"
      AUTH_SERVICE_ADDR: "auth-service:50051"
      COURSE_SERVICE_ADDR: "course-service:50053"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      course-service:
        condition: service_started
    restart: unless-stopped

  messaging-service:
    build:
      context: .
      dockerfile: messaging-service/Dockerfile
      network: host
    environment:
      DB_URL: "postgres://tutofy:secret@postgres/messaging?sslmode=disable"
      PORT: "50060"
      AUTH_SERVICE_ADDR: "auth-service:50051"
      NOTIFICATION_SERVICE_ADDR: "notification-service:50057"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      notification-service:
        condition: service_started
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
      network: host
    environment:
      DB_URL: "postgres://tutofy:secret@postgres/payments?sslmode=disable"
      PORT: "50061"
      AUTH_SERVICE_ADDR: "auth-service:50051"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  media-service:
    build:
      context: .
      dockerfile: media-service/Dockerfile
      network: host
    environment:
      DB_URL: "postgres://tutofy:secret@postgres/media?sslmode=disable"
      PORT: "50062"
      AUTH_SERVICE_ADDR: "auth-service:50051"
      ENROLLMENT_SERVICE_ADDR: "enrollment-service:50054"
      S3_ENDPOINT: "http://minio:9000"
      S3_PUBLIC_ENDPOINT: "http://localhost:9000"
      S3_ACCESS_KEY_ID: "minioadmin"
      S3_SECRET_ACCESS_KEY: "minioadmin"
      S3_BUCKET: "tutofy-media"
      S3_REGION: "us-east-1"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      enrollment-service:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    restart: unless-stopped

  submission-service:
    build:
      context: .
      dockerfile: submission-service/Dockerfile
      network: host
    environment:
      DB_URL: "postgres://tutofy:secret@postgres/submissions?sslmode=disable"
      PORT: "50063"
      AUTH_SERVICE_ADDR: "auth-service:50051"
      ASSIGNMENT_SERVICE_ADDR: "assignment-service:50059"
      ENROLLMENT_SERVICE_ADDR: "enrollment-service:50054"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      assignment-service:
        condition: service_started
      enrollment-service:
        condition: service_started
    restart: unless-stopped

  quiz-service:
    build:
      context: .
      dockerfile: quiz-service/Dockerfile
      network: host
    environment:
      DB_URL: "postgres://tutofy:secret@postgres/quizzes?sslmode=disable"
      PORT: "50064"
      AUTH_SERVICE_ADDR: "auth-service:50051"
      ENROLLMENT_SERVICE_ADDR: "enrollment-service:50054"
      COURSE_SERVICE_ADDR: "course-service:50053"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      enrollment-service:
        condition: service_started
    restart: unless-stopped

  review-service:
    build:
      context: .
      dockerfile: review-service/Dockerfile
      network: host
    environment:
      DB_URL: "postgres://tutofy:secret@postgres/reviews?sslmode=disable"
      PORT: "50065"
      AUTH_SERVICE_ADDR: "auth-service:50051"
      PROGRESS_SERVICE_ADDR: "progress-service:50058"
      ENROLLMENT_SERVICE_ADDR: "enrollment-service:50054"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      progress-service:
        condition: service_started
      enrollment-service:
        condition: service_started
    restart: unless-stopped

  certificate-service:
    build:
      context: .
      dockerfile: certificate-service/Dockerfile
      network: host
    environment:
      DB_URL: "postgres://tutofy:secret@postgres/certificates?sslmode=disable"
      PORT: "50066"
      AUTH_SERVICE_ADDR: "auth-service:50051"
      PROGRESS_SERVICE_ADDR: "progress-service:50058"
      USER_SERVICE_ADDR: "user-service:50052"
      COURSE_SERVICE_ADDR: "course-service:50053"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      progress-service:
        condition: service_started
    restart: unless-stopped

  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
      network: host
    environment:
      PORT: "8080"
      AUTH_SERVICE_ADDR: "auth-service:50051"
      USER_SERVICE_ADDR: "user-service:50052"
      COURSE_SERVICE_ADDR: "course-service:50053"
      ENROLLMENT_SERVICE_ADDR: "enrollment-service:50054"
      LESSON_SERVICE_ADDR: "lesson-service:50055"
      ASSIGNMENT_SERVICE_ADDR: "assignment-service:50059"
      GRADING_SERVICE_ADDR: "grading-service:50056"
      NOTIFICATION_SERVICE_ADDR: "notification-service:50057"
      PROGRESS_SERVICE_ADDR: "progress-service:50058"
      PAYMENT_SERVICE_ADDR: "payment-service:50061"
      MESSAGING_SERVICE_ADDR: "messaging-service:50060"
      MEDIA_SERVICE_ADDR: "media-service:50062"
      REVIEW_SERVICE_ADDR: "review-service:50065"
      SUBMISSION_SERVICE_ADDR: "submission-service:50063"
      QUIZ_SERVICE_ADDR: "quiz-service:50064"
      CERTIFICATE_SERVICE_ADDR: "certificate-service:50066"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-http://localhost:8080/auth/google/callback}"
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  redis-data:
