server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve React SPA — all unknown routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all API calls to the api-gateway
    location ~ ^/(auth|users|courses|enrollments|lessons|assignments|grades|notifications|progress|payments|messages|conversations|my-students|my-tutors|my-coursemates|media|reviews|certificates|marketplace|tutor|admin|submissions|quizzes) {
        proxy_pass http://api-gateway.railway.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 50m;
    }
}
