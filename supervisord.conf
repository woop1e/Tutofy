# ── API Gateway (last, priority 50) ───────────────────────────────────────────

[program:api-gateway]
command=/bin/api-gateway
environment=
    PORT="8080",
    AUTH_SERVICE_ADDR="localhost:50051",
    USER_SERVICE_ADDR="localhost:50052",
    COURSE_SERVICE_ADDR="localhost:50053",
    ENROLLMENT_SERVICE_ADDR="localhost:50054",
    LESSON_SERVICE_ADDR="localhost:50055",
    ASSIGNMENT_SERVICE_ADDR="localhost:50059",
    GRADING_SERVICE_ADDR="localhost:50056",
    NOTIFICATION_SERVICE_ADDR="localhost:50057",
    PROGRESS_SERVICE_ADDR="localhost:50058",
    PAYMENT_SERVICE_ADDR="localhost:50061",
    MESSAGING_SERVICE_ADDR="localhost:50060",
    MEDIA_SERVICE_ADDR="localhost:50062",
    REVIEW_SERVICE_ADDR="localhost:50065",
    SUBMISSION_SERVICE_ADDR="localhost:50063",
    QUIZ_SERVICE_ADDR="localhost:50064",
    CERTIFICATE_SERVICE_ADDR="localhost:50066",
    GOOGLE_CLIENT_ID="%(ENV_GOOGLE_CLIENT_ID)s",
    GOOGLE_CLIENT_SECRET="%(ENV_GOOGLE_CLIENT_SECRET)s",
    GOOGLE_REDIRECT_URI="%(ENV_GOOGLE_REDIRECT_URI)s"
autostart=true
