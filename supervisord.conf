[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
loglevel=warn

# ── Infrastructure ─────────────────────────────────────────────────────────────

[program:nats]
command=/usr/local/bin/nats-server -p 4222
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:minio]
command=/usr/local/bin/minio server /data/minio --console-address :9001
environment=MINIO_ROOT_USER="%(ENV_MINIO_USER)s",MINIO_ROOT_PASSWORD="%(ENV_MINIO_PASS)s"
autostart=true
autorestart=true
priority=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# ── Core services (priority 10) ────────────────────────────────────────────────

[program:auth-service]
command=/bin/auth-service
environment=
    DB_URL="%(ENV_AUTH_DB_URL)s",
    PORT="50051",
    JWT_SECRET="%(ENV_JWT_SECRET)s",
    REDIS_ADDR="%(ENV_REDIS_URL)s",
    SMTP_HOST="%(ENV_SMTP_HOST)s",
    SMTP_PORT="%(ENV_SMTP_PORT)s",
    SMTP_USER="%(ENV_SMTP_USER)s",
    SMTP_PASS="%(ENV_SMTP_PASS)s",
    SMTP_FROM="%(ENV_SMTP_FROM)s",
    APP_URL="%(ENV_APP_URL)s"
autostart=true
autorestart=true
priority=10
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:user-service]
command=/bin/user-service
environment=
    DB_URL="%(ENV_USER_DB_URL)s",
    PORT="50052",
    AUTH_SERVICE_ADDR="localhost:50051",
    REDIS_ADDR="%(ENV_REDIS_URL)s"
autostart=true
autorestart=true
priority=20
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:course-service]
command=/bin/course-service
environment=
    DB_URL="%(ENV_COURSE_DB_URL)s",
    PORT="50053",
    AUTH_SERVICE_ADDR="localhost:50051",
    REDIS_ADDR="%(ENV_REDIS_URL)s"
autostart=true
autorestart=true
priority=20
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:notification-service]
command=/bin/notification-service
environment=
    DB_URL="%(ENV_NOTIFICATION_DB_URL)s",
    PORT="50057",
    AUTH_SERVICE_ADDR="localhost:50051",
    USER_SERVICE_ADDR="localhost:50052",
    NATS_ADDR="nats://localhost:4222",
    SMTP_HOST="%(ENV_SMTP_HOST)s",
    SMTP_PORT="%(ENV_SMTP_PORT)s",
    SMTP_USER="%(ENV_SMTP_USER)s",
    SMTP_PASS="%(ENV_SMTP_PASS)s",
    SMTP_FROM="%(ENV_SMTP_FROM)s"
autostart=true
autorestart=true
priority=20
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:payment-service]
command=/bin/payment-service
environment=
    DB_URL="%(ENV_PAYMENT_DB_URL)s",
    PORT="50061",
    AUTH_SERVICE_ADDR="localhost:50051"
autostart=true
autorestart=true
priority=20
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

